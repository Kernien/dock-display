<!doctype html>
<!-- Source for preview.png. Render with:
     msedge --headless --hide-scrollbars --window-size=1280,640 --screenshot=preview.png preview.html -->
<html>
<head>
<meta charset="utf-8">
<style>
  html, body { margin: 0; width: 1280px; height: 640px; overflow: hidden; }
  body {
    font-family: "Segoe UI", "Motiva Sans", Arial, sans-serif;
    color: #e6edf3;
    background:
      radial-gradient(900px 500px at 85% 40%, rgba(26, 159, 255, .22), transparent 60%),
      linear-gradient(135deg, #0b1118 0%, #131c27 55%, #0b1118 100%);
    display: flex; align-items: center;
  }
  .text { flex: 1; padding-left: 80px; padding-right: 40px; }
  .tag { display: inline-block; font-size: 18px; letter-spacing: .08em; text-transform: uppercase;
         color: #1a9fff; border: 1px solid rgba(26,159,255,.5); border-radius: 6px; padding: 4px 12px; }
  h1 { font-size: 76px; margin: 22px 0 12px; font-weight: 700; letter-spacing: -.01em; }
  .lead { font-size: 28px; line-height: 1.35; color: #b7c3cf; margin: 0 0 34px; max-width: 600px; }
  ul { list-style: none; padding: 0; margin: 0; font-size: 22px; color: #d4dde6; }
  li { margin: 12px 0; padding-left: 34px; position: relative; }
  li::before { content: ""; position: absolute; left: 0; top: 9px; width: 14px; height: 14px;
               border-radius: 50%; background: #1a9fff; box-shadow: 0 0 12px rgba(26,159,255,.7); }
  .shot-wrap { margin-right: 90px; width: 454px; height: 540px; border-radius: 16px; overflow: hidden;
               background: #000; box-shadow: 0 30px 80px rgba(0,0,0,.6), 0 0 0 1px rgba(255,255,255,.08); }
  /* screenshot.png is the Quick Access page (1093x980); show only the plugin panel. */
  .shot { width: 1312px; margin: -6px 0 0 -82px; display: block; }
</style>
</head>
<body>
  <div class="text">
    <span class="tag">Decky Loader plugin</span>
    <h1>Dock Display</h1>
    <p class="lead">Keep the picture on the Steam Deck screen while docked — use the dock just as a charger.</p>
    <ul>
      <li>One toggle in Quick Access, no cable unplugging</li>
      <li>Auto-revert if the monitor shows nothing</li>
      <li>No flicker while the monitor wakes up</li>
    </ul>
  </div>
  <div class="shot-wrap"><img class="shot" src="screenshot.png" alt=""></div>
</body>
</html>
