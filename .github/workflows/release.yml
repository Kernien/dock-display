name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm build

      - name: Package
        run: |
          mkdir -p out/dock-display/dist
          cp dist/index.js out/dock-display/dist/
          cp main.py plugin.json package.json LICENSE README.md out/dock-display/
          cd out && zip -r dock-display.zip dock-display

      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" out/dock-display.zip --title "$GITHUB_REF_NAME" --generate-notes
